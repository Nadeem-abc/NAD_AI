<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - NAD AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>NAD AI 🤖</h1>

        <h2>Create Account</h2>


        {% if error %}

            <p class="error-message">

                {{ error }}

            </p>

        {% endif %}


        <form method="POST"
              action="/signup">


            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">

                Create Account

            </button>

        </form>


        <p>

            Already have an account?

            <a href="/login">

                Login

            </a>

        </p>

    </div>

</div>

</body>

</html>
