<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NAD AI</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="app-container">


    <!-- =========================================
    SIDEBAR
    ========================================= -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <h2 class="sidebar-logo">
                ✦ NAD AI
            </h2>


            <button
                type="button"
                class="new-chat-btn"
                onclick="createNewChat()"
            >
                ＋ New Chat
            </button>

        </div>


        <!-- =========================================
        CHAT HISTORY
        ========================================= -->

        <div
            class="history-section"
            id="history-section"
        >

            <p class="history-title">
                Recent Chats
            </p>


            <div id="chat-history">

                {% for conversation in conversations %}

                    <button
                        type="button"
                        class="history-chat"
                        onclick="loadChat('{{ conversation._id }}')"
                    >

                        💬

                        <span>
                            {{ conversation.title }}
                        </span>

                    </button>

                {% endfor %}

            </div>

        </div>


        <!-- =========================================
        SIDEBAR BOTTOM
        ========================================= -->

        <div class="sidebar-bottom">

            <div class="user-info">

                <div class="user-avatar">
                    {{ email[0].upper() }}
                </div>


                <div class="user-email">
                    {{ email }}
                </div>

            </div>


            <a
                href="/logout"
                class="logout-btn"
            >
                Logout
            </a>

        </div>

    </aside>



    <!-- =========================================
    MAIN CHAT
    ========================================= -->

    <main class="main-chat">


        <!-- =========================================
        CHAT HEADER
        ========================================= -->

        <header class="chat-header">

            <div>

                <h1>
                    NAD AI
                </h1>


                <p>
                    Your intelligent AI assistant
                </p>

            </div>

        </header>



        <!-- =========================================
        CHAT BOX
        ========================================= -->

        <div
            class="chat-box"
            id="chat-box"
        >

            <div class="welcome-screen">

                <div class="welcome-icon">
                    ✦
                </div>


                <h2>
                    How can I help you today?
                </h2>


                <p>
                    Ask anything. NAD AI is ready to help.
                </p>

            </div>

        </div>



        <!-- =========================================
        INPUT AREA
        ========================================= -->

        <div class="input-area">


            <form
                class="input-form"
                id="chat-form"
                onsubmit="sendMessage(event)"
            >


                <!-- ATTACHMENT BUTTON -->

                <button
                    type="button"
                    class="attachment-btn"
                    title="Attachments"
                    onclick="showAttachmentMessage()"
                >
                    ＋
                </button>



                <!-- MESSAGE INPUT -->

                <textarea
                    id="user-input"
                    placeholder="Message NAD AI..."
                    rows="1"
                    required
                ></textarea>



                <!-- VOICE BUTTON -->

                <button
                    type="button"
                    class="voice-btn"
                    id="voice-button"
                    title="Voice Input"
                >

                    <svg
                        class="voice-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 15a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"
                        />

                        <path
                            d="M5 11a7 7 0 0 0 14 0"
                        />

                        <path
                            d="M12 18v3"
                        />

                        <path
                            d="M8 21h8"
                        />

                    </svg>

                </button>



                <!-- SEND BUTTON -->

                <button
                    type="submit"
                    class="send-btn"
                    title="Send message"
                >
                    ↑
                </button>


            </form>


            <p class="input-note">
                NAD AI can make mistakes. Check important information.
            </p>


        </div>


    </main>


</div>



<!-- =========================================
IMPORTANT:
DO NOT DEFINE currentConversationId HERE.

It is already defined inside script.js.
========================================= -->



<!-- =========================================
MAIN JAVASCRIPT
========================================= -->

<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
